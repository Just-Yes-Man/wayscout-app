spring.application.name=wayscout
weather.api.key=${WEATHER_API_KEY:}
tomtom.api.key=${TOMTOM_API_KEY:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}
firebase.credentials.base64=${FIREBASE_CREDENTIALS_BASE64:}
